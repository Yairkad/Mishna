name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Version 1.5.0 from run 14, +0.0.1 per build; after x.y.9 comes x.(y+1).0, after x.9.9 comes (x+1).0.0.
      - name: Version
        run: |
          n=$(( ${{ github.run_number }} - 14 + 150 ))
          echo "VERSION_NAME=$((n / 100)).$(((n / 10) % 10)).$((n % 10))" >> "$GITHUB_ENV"
      - name: Core tests
        run: ./gradlew :core:test
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mishna-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      # Each push publishes a release; the app's "check for update" reads the latest one.
      - name: Publish release
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/debug/app-debug.apk mishna.apk
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: build-${{ github.run_number }}
          name: גרסה ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: mishna.apk
          make_latest: true
